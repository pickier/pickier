name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Installs what deps.yaml lists (Bun, Zig) and the package dependencies
      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@4fd7d56fd1f3149299f8c4b7b65620efcf6e0324 # main

      - name: Lint
        run: bun run lint

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Installs what deps.yaml lists (Bun, Zig) and the package dependencies
      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@4fd7d56fd1f3149299f8c4b7b65620efcf6e0324 # main

      - name: Typecheck
        run: bun --bun run typecheck

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Installs what deps.yaml lists (Bun, Zig) and the package dependencies
      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@4fd7d56fd1f3149299f8c4b7b65620efcf6e0324 # main

      - name: Unit Test
        run: bun run test

  # The native lint engine (packages/zig/src/native): its unit tests, a build
  # for every platform the package ships, the whole test suite run with it,
  # and its reports checked against the TypeScript linter, rule by rule.
  native:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Installs what deps.yaml lists (Bun, Zig) and the package dependencies
      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@4fd7d56fd1f3149299f8c4b7b65620efcf6e0324 # main

      - name: Native unit tests
        working-directory: packages/zig
        run: |
          zig test src/native/test_root.zig
          zig test src/native/text.zig

      - name: Build the native engine for every platform
        working-directory: packages/pickier
        run: bun scripts/build-native.ts --required

      - name: Unit tests with the native engine
        run: bun run test

      - name: Native vs TypeScript parity
        working-directory: packages/zig
        run: |
          dirs="../pickier/src ../pickier/test ../../bechmarks/fixtures"
          bun scripts/parity.ts $dirs
          for id in $(bun -e "import { NATIVE_RULES } from '../pickier/src/native'; console.log([...NATIVE_RULES].join(' '))"); do
            bun scripts/parity.ts $dirs --rule "$id"
          done
