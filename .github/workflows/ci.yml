name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Installs what deps.yaml lists (Bun, Zig) and the package dependencies
      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@3de609e1a7e305393b3d94e2848d859b39c5b5de # v0.11.120
        with:
          version: '0.11.120'

      - name: Lint
        run: bun run lint

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Installs what deps.yaml lists (Bun, Zig) and the package dependencies
      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@3de609e1a7e305393b3d94e2848d859b39c5b5de # v0.11.120
        with:
          version: '0.11.120'

      - name: Typecheck
        run: bun --bun run typecheck

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Installs what deps.yaml lists (Bun, Zig) and the package dependencies
      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@3de609e1a7e305393b3d94e2848d859b39c5b5de # v0.11.120
        with:
          version: '0.11.120'

      - name: Unit Test
        run: bun run test

  # The native lint engine (packages/zig/src/native): its unit tests, a build
  # for every platform the package ships, the whole test suite run with it,
  # and its reports checked against the TypeScript linter, rule by rule.
  native:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Installs what deps.yaml lists (Bun, Zig) and the package dependencies
      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@3de609e1a7e305393b3d94e2848d859b39c5b5de # v0.11.120
        with:
          version: '0.11.120'

      - name: Native unit tests
        working-directory: packages/zig
        run: |
          zig test src/native/test_root.zig
          zig test src/native/text.zig
          zig test src/walker.zig

      - name: Build the native engine for every platform
        working-directory: packages/pickier
        run: bun scripts/build-native.ts --required

      - name: Unit tests with the native engine
        run: bun run test

      - name: Native vs TypeScript parity
        working-directory: packages/zig
        run: |
          dirs="../pickier/src ../pickier/test ../../bechmarks/fixtures"
          bun scripts/parity.ts $dirs
          for id in $(bun -e "import { NATIVE_RULES } from '../pickier/src/native'; console.log([...NATIVE_RULES].join(' '))"); do
            bun scripts/parity.ts $dirs --rule "$id"
          done

  # What the other jobs here do not reach. `bun test` is scoped to
  # packages/pickier by the root bunfig, and nothing built the docs or the
  # extension, so all three broke on main without a job failing: a docs link
  # resolved from the wrong directory, `@types/vscode` drifted past
  # `engines.vscode` (which makes `vsce package` refuse outright), and the
  # extension's own suite sat at 7 failures for nine months.
  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Installs what deps.yaml lists (Bun, Zig) and the package dependencies
      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@3de609e1a7e305393b3d94e2848d859b39c5b5de # v0.11.120
        with:
          version: '0.11.120'

      - name: Build the docs
        run: bun run build:docs

      # `pretest` builds the extension and lints it, so this covers both.
      - name: VS Code extension tests
        working-directory: packages/vscode
        run: bun run test

      - name: Package the VS Code extension
        working-directory: packages/vscode
        run: bunx @vscode/vsce package --no-dependencies --out "$RUNNER_TEMP/pickier.vsix"
