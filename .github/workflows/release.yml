name: Releaser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to build and finalize
        required: true
        type: string

jobs:
  source-gate:
    name: Verify the exact release source
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  npm:
    needs: source-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Verify the immutable release source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"

      # Installs what deps.yaml lists - Bun, and the Zig that cross-compiles
      # the native lint engine shipped in the package - and the package
      # dependencies
      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@ada000b82afec8e198f915bb2aafa6791fa01abd # v0.11.199
        with:
          version: '0.11.199'

      # npm can accept an upload before public readback becomes available. A
      # recovery then skips the existing version, including its lifecycle hooks.
      # Build on every attempt so the GitHub release always receives its assets.
      - name: Build the release artifacts
        working-directory: packages/pickier
        run: bun run prepublishOnly

      - name: Qualify original package bytes before publication
        id: package-sdk
        run: bun run test:package
        env:
          PICKIER_PACKAGE_EVIDENCE: ${{ runner.temp }}/pickier-package-sdk

      - name: Retain publication SDK evidence
        if: always() && steps.package-sdk.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: pickier-package-sdk-release
          path: ${{ runner.temp }}/pickier-package-sdk
          if-no-files-found: error

      - name: Publish
        working-directory: packages/pickier
        run: pantry publish --npm --access public --ignore-scripts
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: stacksjs/action-releaser@cc6cd61791cf7556459ca35ad536800561277e3e # v1.2.11
        with:
          tag: ${{ inputs.tag || github.ref_name }}
          files: |
            packages/pickier/bin/pickier-linux-x64.zip
            packages/pickier/bin/pickier-linux-arm64.zip
            packages/pickier/bin/pickier-linux-x64-musl.zip
            packages/pickier/bin/pickier-linux-arm64-musl.zip
            packages/pickier/bin/pickier-windows-x64.zip
            packages/pickier/bin/pickier-windows-arm64.zip
            packages/pickier/bin/pickier-darwin-x64.zip
            packages/pickier/bin/pickier-darwin-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
